<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD Web Components</title>
    <meta
      name="description"
      content="CRUD de usuarios con Web Components, Express y MySQL"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="app-header">
      <div class="header-logo">
        <div class="logo-icon">
          <svg
            viewBox="0 0 60 60"
            width="50"
            height="50"
            xmlns="http://www.w3.org/2000/svg"
          >
            <ellipse
              cx="30"
              cy="24"
              rx="26"
              ry="18"
              fill="#00e5ff"
              opacity="0.9"
            />
            <ellipse cx="30" cy="22" rx="22" ry="14" fill="#0097a7" />
            <circle cx="20" cy="16" r="5" fill="#ffffff" opacity="0.5" />
            <circle cx="30" cy="10" r="6" fill="#fff" opacity="0.3" />
            <g transform="translate(22,14)">
              <circle
                cx="8"
                cy="8"
                r="7"
                fill="none"
                stroke="#fff"
                stroke-width="2"
              />
              <line
                x1="8"
                y1="1"
                x2="8"
                y2="4"
                stroke="#fff"
                stroke-width="2"
              />
              <line
                x1="8"
                y1="12"
                x2="8"
                y2="15"
                stroke="#fff"
                stroke-width="2"
              />
              <line
                x1="1"
                y1="8"
                x2="4"
                y2="8"
                stroke="#fff"
                stroke-width="2"
              />
              <line
                x1="12"
                y1="8"
                x2="15"
                y2="8"
                stroke="#fff"
                stroke-width="2"
              />
              <circle cx="8" cy="8" r="3" fill="#fff" />
            </g>
            <text
              x="30"
              y="46"
              text-anchor="middle"
              fill="#fff"
              font-size="8"
              font-weight="bold"
              font-family="Roboto,sans-serif"
            >
              REST API
            </text>
          </svg>
        </div>
      </div>
      <nav class="header-nav">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </nav>
    </header>

    <!-- Main layout -->
    <main class="app-main">
      <!-- Left: User list -->
      <section class="list-section" id="listSection">
        <user-list id="userList"></user-list>
      </section>

      <!-- Right: Form -->
      <section class="form-section">
        <user-form id="userForm"></user-form>
      </section>
    </main>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <!-- Web Components -->
    <script src="js/components/user-card.js"></script>
    <script src="js/components/user-form.js"></script>
    <script src="js/components/user-list.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
